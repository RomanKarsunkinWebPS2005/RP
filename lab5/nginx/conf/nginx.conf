worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format proxy_log '$remote_addr - [$time_local] '
                         '"$request" $status $body_bytes_sent '
                         'upstream: $upstream_addr | time: $upstream_response_time s ';

    upstream backend {
        ip_hash;
        server valuator-1:80 max_fails=3 fail_timeout=30s;
        server valuator-2:80 max_fails=3 fail_timeout=30s;
        server valuator-3:80 max_fails=3 fail_timeout=30s;
        server valuator-4:80 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8080;
        server_name localhost;

        access_log /var/log/nginx/proxy_access.log proxy_log;
        error_log /var/log/nginx/proxy_error.log warn;

        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /summaryHub {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}