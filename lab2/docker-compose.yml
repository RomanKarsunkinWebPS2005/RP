version: '3.8'

x-valuator-common: &valuator-common
  build:
    context: .
    dockerfile: Valuator/Dockerfile
  depends_on:
    - redis
  environment:
    - REDIS_CONNECTION=${REDIS_CONNECTION}
    - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    - ASPNETCORE_URLS=http://+:80
  expose:
    - "80"
  volumes:
    - ~/.nuget/packages:/root/.nuget/packages:ro

services:
  valuator-1:
    <<: *valuator-common
    container_name: valuator-1
    ports:
      - "5001:80"
    volumes:
      - ./Valuator:/app 

  valuator-2:
    <<: *valuator-common
    container_name: valuator-2
    ports:
      - "5002:80"
    volumes:
      - ./Valuator:/app

  valuator-3:
    <<: *valuator-common
    container_name: valuator-3
    ports:
      - "5003:80"
    volumes:
      - ./Valuator:/app

  valuator-4:
    <<: *valuator-common
    container_name: valuator-4
    ports:
      - "5004:80"
    volumes:
      - ./Valuator:/app

  redis:
    image: redis:alpine
    container_name: distributed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf  
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - valuator-1
      - valuator-2
      - redis


volumes:
  redis-data: 