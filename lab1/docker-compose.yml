services:
  valuator:
    image: ${DOCKER_REGISTRY-}valuator
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    depends_on:
      - redis
    environment:
      - REDIS_CONNECTION=${REDIS_CONNECTION}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
    ports:
      - "8080:80"  
    volumes:
      - ./Valuator:/app
      - ~/.nuget/packages:/root/.nuget/packages:ro

  redis:
    image: redis:alpine
    container_name: distributed-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf  
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  redis-data: